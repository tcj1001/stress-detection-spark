server:
  port: ${STRESS_SPRING_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${STRESS_DB_HOST:localhost}:${STRESS_DB_PORT:3306}/${STRESS_DB_NAME:stress_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${STRESS_DB_USER:stress_app}
    password: ${STRESS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

jwt:
  secret: ${STRESS_JWT_SECRET}
  expiration: 86400000  # 24小时，毫秒

app:
  admin:
    initial-password: ${STRESS_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${STRESS_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173}

logging:
  level:
    com.stress: INFO
